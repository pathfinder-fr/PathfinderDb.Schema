name: Publish NuGet package

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: nuget-publish
  cancel-in-progress: false

jobs:
  package:
    name: Build and validate release package
    runs-on: ubuntu-latest
    outputs:
      package-version: ${{ steps.version.outputs.package-version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Read and validate tag version
        id: version
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if ($env:TAG_NAME -notmatch '^v(?<version>0|[1-9]\d*)\.(?<minor>0|[1-9]\d*)\.(?<patch>0|[1-9]\d*)(?<suffix>-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$') {
            throw "Tag '$env:TAG_NAME' is not a supported SemVer tag."
          }

          $version = "$($Matches.version).$($Matches.minor).$($Matches.patch)$($Matches.suffix)"
          "package-version=$version" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore PathfinderDb.Schema.sln --nologo

      - name: Build
        run: dotnet build PathfinderDb.Schema.sln -c Release --no-restore --nologo

      - name: Test
        run: dotnet test PathfinderDb.Schema.sln -c Release --no-build --nologo --verbosity minimal

      - name: Pack
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.package-version }}
        run: |
          New-Item -ItemType Directory -Force ./artifacts | Out-Null
          dotnet pack ./src/PathfinderDb.Schema/PathfinderDb.Schema.csproj `
            -c Release --no-build --nologo -o ./artifacts `
            -p:PackageVersion=$env:PACKAGE_VERSION

      - name: Validate package
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.package-version }}
        run: |
          ./build/Validate-Package.ps1 `
            -PackagePath "./artifacts/PathfinderDb.Schema.$env:PACKAGE_VERSION.nupkg"

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-release-${{ steps.version.outputs.package-version }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Push package to NuGet.org
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    environment:
      name: nuget
      url: https://www.nuget.org/packages/PathfinderDb.Schema

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-release-${{ needs.package.outputs.package-version }}
          path: artifacts

      - name: NuGet login (OIDC)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push packages
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_API_KEY)) {
            throw 'NuGet trusted publishing did not return a temporary API key.'
          }

          Get-ChildItem ./artifacts -File |
            Where-Object { $_.Extension -in '.nupkg', '.snupkg' } |
            ForEach-Object {
              dotnet nuget push $_.FullName `
                --api-key $env:NUGET_API_KEY `
                --source https://api.nuget.org/v3/index.json `
                --skip-duplicate
              if ($LASTEXITCODE -ne 0) {
                throw "NuGet push failed for $($_.Name)."
              }
            }

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME" \
            artifacts/*
