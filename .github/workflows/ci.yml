name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  validate:
    name: Restore, build, test and pack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore PathfinderDb.Schema.sln --nologo

      - name: Build
        run: dotnet build PathfinderDb.Schema.sln -c Release --no-restore --nologo

      - name: Test
        run: dotnet test PathfinderDb.Schema.sln -c Release --no-build --nologo --verbosity minimal

      - name: Pack
        shell: pwsh
        run: |
          $version = "0.0.0-ci.${{ github.run_number }}"
          New-Item -ItemType Directory -Force ./artifacts | Out-Null
          dotnet pack ./src/PathfinderDb.Schema/PathfinderDb.Schema.csproj `
            -c Release --no-build --nologo -o ./artifacts `
            -p:PackageVersion=$version

      - name: Validate package
        shell: pwsh
        run: |
          $package = Get-ChildItem ./artifacts -Filter *.nupkg |
            Where-Object { $_.Name -notlike '*.snupkg' } |
            Select-Object -First 1
          ./build/Validate-Package.ps1 -PackagePath $package.FullName

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages-${{ github.run_number }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
